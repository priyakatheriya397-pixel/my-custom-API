<script>
const API_URL = "https://my-custom-api-wyni.onrender.com/api/prateek";

async function loadAPI() {
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  status.textContent = "Loading...";

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP Error: ${response.status}`);
    }

    const data = await response.json();

    output.innerHTML = `
      <div class="card">
        <h2>${escapeHTML(data.message ?? "No message")}</h2>
        <p><b>Developer:</b> ${escapeHTML(data.developer ?? "-")}</p>
        <p><b>Status:</b> ${escapeHTML(data.status ?? "-")}</p>
      </div>
    `;

    status.textContent = "API Connected ✓";

  } catch (error) {
    console.error(error);

    status.textContent = "API Connection Failed";
    output.innerHTML = `
      <div class="error">
        API से data नहीं मिला।<br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadAPI();
          </script>
